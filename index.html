<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahul &amp; Safa — Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F4EDE2;
    --ivory-deep:#EDE3D3;
    --brown-deep:#3B2A20;
    --brown:#6B4A34;
    --brown-soft:#9C7A56;
    --gold:#B08D57;
    --line:#D8C7AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--brown-deep);
    font-family:'EB Garamond', serif;
    overflow-x:hidden;
  }
  .display{font-family:'Cormorant Garamond', serif;}

  /* ---------- Intro: parting doors reveal ---------- */
  #intro-screen{
    position:fixed; inset:0; z-index:50;
    overflow:hidden;
    cursor:pointer;
  }
  #intro-screen.hidden{ visibility:hidden; pointer-events:none; }

  .door{
    position:absolute; top:0; bottom:0; width:50%;
    background:
      radial-gradient(140% 100% at 50% 0%, rgba(255,255,255,.05), transparent 55%),
      linear-gradient(160deg, #241A12 0%, #170F09 60%, #100A05 100%);
    transition:transform 1.15s cubic-bezier(.76,0,.24,1);
  }
  .door.left{ left:0; border-right:1px solid rgba(205,167,101,.28); }
  .door.right{ right:0; border-left:1px solid rgba(205,167,101,.28); }
  #intro-screen.opening .door.left{ transform:translateX(-100%); }
  #intro-screen.opening .door.right{ transform:translateX(100%); }

  .intro-content{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:2; pointer-events:none;
    transition:opacity .7s ease, transform .8s cubic-bezier(.22,.61,.24,1);
  }
  #intro-screen.opening .intro-content{
    opacity:0; transform:translateY(-18px) scale(1.04);
  }

  .intro-kicker{
    font-family:'EB Garamond', serif; font-style:italic;
    font-size:12px; letter-spacing:.34em; color:#CDA765;
    margin-bottom:26px;
  }

  .medallion{
    width:104px; height:104px; border-radius:50%;
    border:1px solid rgba(205,167,101,.55);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    margin-bottom:26px;
  }
  .medallion::before{
    content:"";
    position:absolute; inset:8px; border-radius:50%;
    border:1px solid rgba(205,167,101,.3);
  }
  .medallion .mono{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:34px; color:#F3E8D6;
  }

  .intro-names{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(42px, 9vw, 60px);
    font-weight:500; color:#F7EEDD;
    line-height:1.15;
  }
  .intro-names .intro-amp{
    font-style:italic; color:#CDA765; font-size:.7em; padding:0 6px;
  }

  .intro-date{
    margin-top:16px;
    font-size:14px; letter-spacing:.14em; color:#C9B896;
  }

  .intro-enter{
    margin-top:44px;
    font-size:11px; letter-spacing:.32em; color:#CDA765;
    padding-bottom:6px;
    border-bottom:1px solid rgba(205,167,101,.5);
  }

  .flash{
    position:absolute; top:50%; left:50%;
    width:20px; height:20px; border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle, rgba(247,238,221,.9), rgba(205,167,101,0) 70%);
    z-index:3; opacity:0; pointer-events:none;
    transition:transform .9s ease-out, opacity .9s ease-out;
  }
  #intro-screen.opening .flash{
    transform:translate(-50%,-50%) scale(60);
    opacity:1;
  }

  /* ---------- Page ---------- */
  .wrap{max-width:640px; margin:0 auto; padding:0 28px;}

  header.hero{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    position:relative;
    padding:60px 24px;
  }
  .kicker{
    font-size:14px; letter-spacing:.18em; color:var(--brown-soft);
  }
  .names{
    font-size:clamp(52px, 12vw, 92px);
    line-height:1.02;
    margin:18px 0 10px;
    font-weight:500;
  }
  .amp{
    display:block;
    font-style:italic;
    font-size:0.55em;
    color:var(--gold);
    margin:2px 0;
  }
  .hero-date{
    font-size:18px; letter-spacing:.08em; color:var(--brown);
    margin-top:8px;
  }
  .rule{
    width:64px; height:1px; background:var(--line); margin:26px auto;
  }

  /* countdown */
  .countdown{
    display:flex; gap:22px; justify-content:center; margin-top:6px;
    flex-wrap:wrap;
  }
  .countdown .unit{ text-align:center; min-width:64px; }
  .countdown .num{
    font-family:'Cormorant Garamond', serif;
    font-size:44px; color:var(--brown-deep);
    font-variant-numeric: tabular-nums;
  }
  .countdown .lbl{
    font-size:11px; letter-spacing:.14em; color:var(--brown-soft);
    margin-top:2px;
  }

  section{ padding:90px 0; border-top:1px solid var(--line); }
  section:first-of-type{ border-top:none; }
  .section-head{ text-align:center; margin-bottom:44px; }
  .section-title{ font-size:38px; margin:0; font-weight:500; }
  .section-sub{ color:var(--brown-soft); font-size:16px; margin-top:8px; font-style:italic; }

  .story p{
    font-size:19px; line-height:1.75; color:var(--brown-deep);
    text-align:center;
    max-width:480px; margin:0 auto 20px;
  }

  .details-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:36px;
  }
  .detail-card{ text-align:center; }
  .detail-card .icon{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:15px; color:var(--gold); letter-spacing:.08em;
  }
  .detail-card h3{ font-size:26px; margin:10px 0 6px; font-weight:500; }
  .detail-card p{ margin:0; color:var(--brown); line-height:1.6; font-size:16px; }

  .rsvp{ text-align:center; }
  .rsvp p{ color:var(--brown); font-size:17px; max-width:420px; margin:0 auto 30px; line-height:1.7; }
  .btn{
    display:inline-block;
    padding:14px 40px;
    background:var(--brown-deep);
    color:var(--ivory);
    text-decoration:none;
    font-size:15px; letter-spacing:.1em;
    border:1px solid var(--brown-deep);
    transition:background .3s ease, color .3s ease;
  }
  .btn:hover{ background:transparent; color:var(--brown-deep); }

  footer{
    text-align:center; padding:50px 24px 60px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; color:var(--brown-soft); font-size:16px;
  }

  @media (max-width:520px){
    .details-grid{ grid-template-columns:1fr; gap:40px; }
    .countdown{ gap:14px; }
    .countdown .unit{ min-width:52px; }
    .countdown .num{ font-size:34px; }
    section{ padding:64px 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .door, .intro-content, .flash{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="intro-screen">
  <div class="door left"></div>
  <div class="door right"></div>
  <div class="flash"></div>
  <div class="intro-content">
    <div class="intro-kicker">The wedding of</div>
    <div class="medallion"><span class="mono">S·S</span></div>
    <div class="intro-names display">Shahul<span class="intro-amp">&amp;</span>Safa</div>
    <div class="intro-date">22 November 2026</div>
    <div class="intro-enter">Click to enter</div>
  </div>
</div>

<header class="hero">
  <div class="kicker">TOGETHER WITH THEIR FAMILIES</div>
  <h1 class="names display">Shahul<span class="amp">&amp;</span>Safa</h1>
  <div class="hero-date">SUNDAY, NOVEMBER 22, 2026</div>
  <div class="rule"></div>
  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="cd-days">00</div><div class="lbl">DAYS</div></div>
    <div class="unit"><div class="num" id="cd-hours">00</div><div class="lbl">HOURS</div></div>
    <div class="unit"><div class="num" id="cd-mins">00</div><div class="lbl">MINUTES</div></div>
    <div class="unit"><div class="num" id="cd-secs">00</div><div class="lbl">SECONDS</div></div>
  </div>
</header>

<footer>Sha &amp; Safa · November 22, 2026</footer>

<script>
  const introScreen = document.getElementById('intro-screen');
  introScreen.addEventListener('click', () => {
    if (introScreen.classList.contains('opening')) return;
    introScreen.classList.add('opening');
    setTimeout(() => introScreen.classList.add('hidden'), 1250);
  });

  const weddingDate = new Date('2026-11-22T16:00:00');
  const els = {
    days: document.getElementById('cd-days'),
    hours: document.getElementById('cd-hours'),
    mins: document.getElementById('cd-mins'),
    secs: document.getElementById('cd-secs'),
  };
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const now = new Date();
    let diff = weddingDate - now;
    if(diff < 0) diff = 0;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    els.days.textContent = pad(days);
    els.hours.textContent = pad(hours);
    els.mins.textContent = pad(mins);
    els.secs.textContent = pad(secs);
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
