<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Shahul & Safwana</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #eee7dc;
            font-family: "Cormorant Garamond", serif;
        }


        /* =========================================================
           PAGE SYSTEM
        ========================================================= */

        .page {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            opacity: 0;
            visibility: hidden;

            transform: scale(1.02);

            transition:
                opacity 1s ease,
                visibility 1s ease,
                transform 1.2s ease;

            overflow: hidden;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }


        /* =========================================================
           PAGE 1 — COVER
        ========================================================= */

        #page1 {
            background:
                linear-gradient(
                    180deg,
                    rgba(245, 238, 227, 0.08),
                    rgba(225, 211, 193, 0.28)
                ),
                #eee7dc;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /*
            Main cover image

            Put your own graphic here:

            images/cover.jpg
        */

        .cover-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /*
            Soft beige overlay
            Keeps the image elegant and muted.
        */

        .cover-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(250, 245, 237, 0.12) 0%,
                    rgba(250, 245, 237, 0.04) 45%,
                    rgba(112, 91, 67, 0.18) 100%
                );

            z-index: 2;
        }


        /*
            Optional subtle grain
        */

        .cover-overlay::after {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(
                    rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px
                );

            background-size: 4px 4px;

            opacity: 0.15;

            pointer-events: none;
        }


        /* =========================================================
           PAGE 1 CONTENT
        ========================================================= */

        .cover-content {
            position: relative;

            z-index: 5;

            width: 90%;
            max-width: 500px;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            color: #4d4034;
        }


        /*
            Small Arabic / decorative text
        */

        .bismillah {
            font-family: "Cormorant Garamond", serif;

            font-size: 17px;
            letter-spacing: 2px;

            margin-bottom: 25px;

            opacity: 0.85;
        }


        /*
            Names
        */

        .couple-names {
            font-family: "Great Vibes", cursive;

            font-size: clamp(58px, 12vw, 100px);

            line-height: 1;

            font-weight: 400;

            text-shadow:
                0 2px 10px rgba(255,255,255,0.35);

            margin-bottom: 18px;
        }


        .wedding-date {
            font-family: "Montserrat", sans-serif;

            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;

            margin-bottom: 42px;
        }


        /* =========================================================
           CENTER BUTTON
        ========================================================= */

        .open-button {

            position: relative;

            min-width: 190px;
            min-height: 58px;

            padding: 15px 30px;

            border: 1px solid rgba(86, 70, 51, 0.55);

            background:
                rgba(248, 242, 232, 0.72);

            color: #4d4034;

            font-family: "Montserrat", sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition:
                background 0.35s ease,
                color 0.35s ease,
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }


        .open-button:hover {
            background: #5c4b3a;

            color: #fffaf2;

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(60, 45, 30, 0.18);
        }


        .open-button:active {
            transform: scale(0.97);
        }


        /* Small decorative line */

        .open-button::before,
        .open-button::after {
            content: "";

            position: absolute;

            top: 50%;

            width: 22px;
            height: 1px;

            background: currentColor;

            opacity: 0.5;
        }

        .open-button::before {
            right: calc(100% + 12px);
        }

        .open-button::after {
            left: calc(100% + 12px);
        }


        /* =========================================================
           SCROLL / ENTER INDICATOR
        ========================================================= */

        .bottom-hint {

            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 5;

            font-family: "Montserrat", sans-serif;

            font-size: 8px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.65;

            white-space: nowrap;
        }


        /* =========================================================
           PAGE 2 — VIDEO
        ========================================================= */

        #page2 {
            background: #17130f;
        }


        .wedding-video {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;

            background: #17130f;
        }


        /*
            Video overlay

            Slightly darkens the video so it feels cinematic.
        */

        .video-overlay {

            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    180deg,
                    rgba(20, 15, 10, 0.20),
                    rgba(20, 15, 10, 0.04) 45%,
                    rgba(20, 15, 10, 0.28)
                );

            pointer-events: none;
        }


        /*
            Video page title
            Remove this if your video already contains
            Shahul & Safa.
        */

        .video-content {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 5;

            text-align: center;

            color: #fffaf2;

            pointer-events: none;

            opacity: 0;

            animation: videoText 2s ease 0.8s forwards;
        }


        .video-names {

            font-family: "Great Vibes", cursive;

            font-size: clamp(52px, 11vw, 90px);

            line-height: 1;

            text-shadow:
                0 4px 25px rgba(0,0,0,0.35);

            white-space: nowrap;
        }


        .video-date {

            margin-top: 15px;

            font-family: "Montserrat", sans-serif;

            font-size: 9px;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        @keyframes videoText {

            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }


        /* =========================================================
           VIDEO LOADING MESSAGE
        ========================================================= */

        .video-loading {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 4;

            color: rgba(255,255,255,0.8);

            font-family: "Montserrat", sans-serif;

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;

            transition: opacity 0.5s ease;
        }

        .video-loading.hidden {
            opacity: 0;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .cover-content {
                width: 92%;
            }

            .bismillah {
                font-size: 15px;
                margin-bottom: 20px;
            }

            .couple-names {
                font-size: clamp(55px, 17vw, 85px);
            }

            .wedding-date {
                font-size: 8px;
                letter-spacing: 4px;
                margin-bottom: 35px;
            }

            .open-button {
                min-width: 175px;
                min-height: 54px;

                padding: 14px 25px;

                font-size: 9px;
                letter-spacing: 2.5px;
            }

            .bottom-hint {
                bottom: 22px;
                font-size: 7px;
            }

            .video-names {
                font-size: 58px;
            }

            .video-date {
                font-size: 8px;
                letter-spacing: 4px;
            }
        }


        /* =========================================================
           VERY SMALL MOBILE
        ========================================================= */

        @media (max-height: 650px) {

            .bismillah {
                margin-bottom: 12px;
            }

            .couple-names {
                font-size: 55px;
                margin-bottom: 12px;
            }

            .wedding-date {
                margin-bottom: 25px;
            }

            .bottom-hint {
                display: none;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         PAGE 1 — OPENING COVER
    ========================================================= -->

    <section id="page1" class="page active">

        <!--
            YOUR COVER GRAPHIC

            Replace:

            images/cover.jpg

            with your actual image.
        -->

        <img
            src="https://cambridgedream.my.canva.site/ivory/_assets/media/836b60ef48887e249b337f93d57579c1.png"
            class="cover-image"
            alt="Wedding invitation cover"
        >


        <!-- Soft overlay -->
        <div class="cover-overlay"></div>


        <!-- Center content -->
        <div class="cover-content">

            <div class="bismillah">
                بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
            </div>


            <div class="couple-names">
                Shahul &amp; Safwana
            </div>


            <div class="wedding-date">
                22 November 2026
            </div>


            <!--
                THIS IS THE CENTER BUTTON

                Clicking this takes the visitor
                to PAGE 2.
            -->

            <button
                class="open-button"
                id="openInvitation"
                type="button"
            >
                Open Invitation
            </button>

        </div>


        <div class="bottom-hint">
            A celebration of love
        </div>

    </section>



    <!-- =========================================================
         PAGE 2 — VIDEO
    ========================================================= -->

    <section id="page2" class="page">

        <!--
            YOUR WEDDING VIDEO

            Put your video here:

            video/wedding.mp4
        -->

        <video
            id="weddingVideo"
            class="wedding-video"
            playsinline
            webkit-playsinline
            muted
            preload="auto"
        >

            <source
                src="blob:https://cambridgedream.my.canva.site/d6df7a89-947f-4112-963a-75846f182f5b"
                type="video/mp4"
            >

            Your browser does not support HTML5 video.

        </video>


        <!-- Cinematic overlay -->
        <div class="video-overlay"></div>


        <!-- Loading text -->
        <div
            class="video-loading"
            id="videoLoading"
        >
            Loading
        </div>


        <!--
            Optional text over video.

            If you DON'T want this text,
            simply delete this entire div.
        -->

        <div class="video-content">

            <div class="video-names">
                Shahul &amp; Safa
            </div>

            <div class="video-date">
                22 November 2026
            </div>

        </div>

    </section>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        const page1 = document.getElementById("page1");
        const page2 = document.getElementById("page2");

        const openButton =
            document.getElementById("openInvitation");

        const weddingVideo =
            document.getElementById("weddingVideo");

        const videoLoading =
            document.getElementById("videoLoading");


        /*
        ============================================================
        PAGE 1 → PAGE 2
        ============================================================
        */

        openButton.addEventListener("click", function () {

            /*
                First show Page 2
            */

            page1.classList.remove("active");

            page2.classList.add("active");


            /*
                Start video automatically.

                Because the visitor has just clicked a button,
                browsers generally allow playback here.
            */

            weddingVideo.currentTime = 0;

            const playPromise =
                weddingVideo.play();


            if (playPromise !== undefined) {

                playPromise
                    .then(function () {

                        videoLoading.classList.add("hidden");

                    })
                    .catch(function (error) {

                        console.log(
                            "Video autoplay failed:",
                            error
                        );

                        videoLoading.textContent =
                            "Tap to play";

                    });

            }

        });


        /*
        ============================================================
        VIDEO EVENTS
        ============================================================
        */

        weddingVideo.addEventListener(
            "playing",
            function () {

                videoLoading.classList.add("hidden");

            }
        );


        weddingVideo.addEventListener(
            "waiting",
            function () {

                videoLoading.classList.remove("hidden");

                videoLoading.textContent =
                    "Loading";

            }
        );


        /*
        ============================================================
        VIDEO ERROR
        ============================================================
        */

        weddingVideo.addEventListener(
            "error",
            function () {

                videoLoading.textContent =
                    "Video could not be loaded";

                console.log(
                    "Check that video/wedding.mp4 exists."
                );

            }
        );


        /*
        ============================================================
        PREVENT ACCIDENTAL PAGE SCROLL
        ============================================================
        */

        document.addEventListener(
            "touchmove",
            function (event) {

                /*
                    Keep the first two pages fixed.
                    We will enable normal scrolling later
                    when we add the remaining invitation pages.
                */

                event.preventDefault();

            },
            {
                passive: false
            }
        );


        /*
        ============================================================
        PREVENT MOUSE WHEEL SCROLL
        ============================================================
        */

        window.addEventListener(
            "wheel",
            function (event) {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

    </script>

</body>
</html>
