<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shahul & Safa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #eee5d8;
            color: #7e654b;
            overflow-x: hidden;
        }


        /* =====================================================
           COMMON
        ===================================================== */

        section {
            width: 100%;
            position: relative;
        }


        /* =====================================================
           1. VIDEO OPENING
        ===================================================== */

        .video-section {
            height: 100vh;
            min-height: 700px;
            position: relative;
            overflow: hidden;
            background: #d9cbbb;
        }

        .wedding-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /*
        Soft ivory overlay.
        This makes the video look more like
        the reference instead of a normal video.
        */

        .video-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(244, 235, 220, 0.25),
                    rgba(110, 82, 55, 0.18)
                );

            z-index: 2;
        }


        /* Video content */

        .video-content {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            z-index: 3;

            width: 90%;
        }

        .bismillah {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(22px, 3vw, 34px);

            color: #806747;

            margin-bottom: 35px;

            letter-spacing: 1px;
        }

        .video-names {
            font-family: "Great Vibes", cursive;

            font-size: clamp(70px, 10vw, 145px);

            font-weight: 400;

            color: #755a3e;

            line-height: 1;
        }

        .video-date {
            margin-top: 30px;

            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            letter-spacing: 5px;

            color: #7d6549;

            text-transform: uppercase;
        }


        /* Scroll indicator */

        .scroll-indicator {
            position: absolute;

            bottom: 35px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 4;

            color: #755d43;

            font-family: "Cormorant Garamond", serif;

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-align: center;
        }

        .scroll-line {
            width: 1px;
            height: 45px;

            background: #9d8262;

            margin: 12px auto 0;
        }


        /* =====================================================
           2. GRAPHIC IMAGE SECTION
        ===================================================== */

        .graphic-section {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eee5d8;

            overflow: hidden;
        }


        /*
        Very subtle background gradient.
        Gives the page the same soft ivory feeling.
        */

        .graphic-background {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.65),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(188,160,125,.16),
                    transparent 35%
                );
        }


        .graphic-wrapper {
            width: min(850px, 90%);

            position: relative;

            z-index: 2;

            text-align: center;
        }


        /*
        Your static graphic.

        Replace images/graphic.jpg with your own
        beige/ivory wedding illustration.
        */

        .graphic-image {
            width: 100%;

            height: min(75vh, 700px);

            object-fit: cover;

            border-radius: 2px;

            opacity: .94;

            filter:
                sepia(.08)
                saturate(.75)
                contrast(.95);

            box-shadow:
                0 20px 60px rgba(83,61,43,.12);
        }


        /* soft gradient over graphic */

        .graphic-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(238,229,216,0.05),
                    rgba(238,229,216,0.35)
                );

            pointer-events: none;
        }


        /* =====================================================
           3. ENVELOPE / INVITATION
        ===================================================== */

        .invitation-section {
            min-height: 100vh;

            background: #e9dfd1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 70px 20px;

            overflow: hidden;
        }


        /*
        Decorative background
        */

        .invitation-section::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(255,255,255,.35),
                    transparent 55%
                );

            pointer-events: none;
        }


        .envelope-container {
            position: relative;

            width: min(900px, 94vw);

            height: min(650px, 75vh);

            min-height: 500px;

            perspective: 1600px;

            z-index: 2;
        }


        /* Envelope */

        .envelope {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 100%;
            height: 100%;

            background: #e4d7c6;

            box-shadow:
                0 30px 80px rgba(74,52,35,.18);

            overflow: visible;
        }


        /*
        Envelope texture
        */

        .envelope::after {
            content: "";

            position: absolute;

            inset: 0;

            opacity: .18;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(120,90,60,.05) 0px,
                    rgba(120,90,60,.05) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }


        /* Left flap */

        .flap-left {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-top: 325px solid transparent;
            border-bottom: 325px solid transparent;

            border-left: 450px solid #ded0be;

            z-index: 2;
        }


        /* Right flap */

        .flap-right {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 0;
            height: 0;

            border-top: 325px solid transparent;
            border-bottom: 325px solid transparent;

            border-right: 450px solid #ded0be;

            z-index: 2;
        }


        /* Bottom flap */

        .flap-bottom {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 450px solid transparent;
            border-right: 450px solid transparent;

            border-bottom: 330px solid #d6c5b1;

            z-index: 4;
        }


        /* Top flap */

        .flap-top {
            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 450px solid transparent;
            border-right: 450px solid transparent;

            border-top: 330px solid #e8dccd;

            transform-origin: top center;

            transition:
                transform 1.5s cubic-bezier(.65,.05,.36,1);

            z-index: 7;
        }


        /* Invitation paper */

        .invitation-paper {
            position: absolute;

            left: 10%;
            bottom: 5%;

            width: 80%;
            height: 82%;

            background: #faf6ee;

            z-index: 3;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(70,50,35,.12);

            transition:
                transform 1.5s cubic-bezier(.65,.05,.36,1);
        }


        .paper-content {
            padding: 30px;
        }

        .paper-small {
            font-family: "Cormorant Garamond", serif;

            font-size: 17px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #967a5a;

            margin-bottom: 25px;
        }

        .paper-names {
            font-family: "Great Vibes", cursive;

            font-size: clamp(60px, 8vw, 100px);

            color: #755a3e;

            line-height: 1;
        }

        .paper-date {
            font-family: "Cormorant Garamond", serif;

            font-size: 18px;

            letter-spacing: 5px;

            margin-top: 30px;

            color: #80684d;
        }


        /* Wax seal */

        .wax-seal {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 115px;
            height: 145px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f0dfc9,
                    #cdb292
                );

            border: 4px solid #d5b995;

            box-shadow:
                0 12px 25px rgba(75,52,35,.22),
                inset 0 0 0 3px rgba(255,255,255,.25);

            z-index: 9;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            transition:
                opacity .7s ease,
                transform .7s ease;
        }

        .wax-seal::before {
            content: "";

            position: absolute;

            inset: 8px;

            border: 1px solid rgba(112,82,51,.25);

            border-radius: 50%;
        }

        .seal-symbol {
            font-family: "Great Vibes", cursive;

            font-size: 30px;

            color: #866d50;

            position: relative;

            z-index: 2;
        }

        .seal-flower {
            font-size: 18px;

            color: #9b805e;

            margin-bottom: 4px;

            position: relative;

            z-index: 2;
        }


        /* Open invitation text */

        .open-invitation {
            position: absolute;

            left: 50%;

            bottom: -65px;

            transform: translateX(-50%);

            border: none;

            background: transparent;

            color: #876d50;

            font-family: "Cormorant Garamond", serif;

            font-size: 14px;

            letter-spacing: 5px;

            text-transform: uppercase;

            cursor: pointer;

            z-index: 20;

            transition: .3s;
        }

        .open-invitation:hover {
            letter-spacing: 7px;
        }


        /* =====================================================
           OPEN ANIMATION
        ===================================================== */

        .invitation-section.open .flap-top {
            transform: rotateX(180deg);
        }

        .invitation-section.open .invitation-paper {
            transform: translateY(-190px);
        }

        .invitation-section.open .wax-seal {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(.6);
        }

        .invitation-section.open .open-invitation {
            opacity: 0;
            pointer-events: none;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 768px) {

            .video-section {
                min-height: 100svh;
            }

            .video-names {
                font-size: 72px;
            }

            .video-date {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .graphic-section {
                min-height: 80vh;
            }

            .graphic-image {
                height: 65vh;
            }

            .envelope-container {
                height: 430px;
                min-height: 430px;
            }

            .flap-left {
                border-top-width: 215px;
                border-bottom-width: 215px;
                border-left-width: 47vw;
            }

            .flap-right {
                border-top-width: 215px;
                border-bottom-width: 215px;
                border-right-width: 47vw;
            }

            .flap-bottom {
                border-left-width: 47vw;
                border-right-width: 47vw;
                border-bottom-width: 220px;
            }

            .flap-top {
                border-left-width: 47vw;
                border-right-width: 47vw;
                border-top-width: 220px;
            }

            .invitation-paper {
                left: 8%;
                width: 84%;
                height: 78%;
            }

            .wax-seal {
                width: 85px;
                height: 105px;
            }

            .seal-symbol {
                font-size: 24px;
            }

            .open-invitation {
                bottom: -55px;
                font-size: 11px;
                letter-spacing: 3px;
            }

        }

    </style>
</head>


<body>


<!-- =====================================================
     SECTION 1
     VIDEO
===================================================== -->

<section class="video-section">

    <video
        class="wedding-video"
        autoplay
        muted
        loop
        playsinline>

        <source
            src="video/wedding.mp4"
            type="video/mp4">

    </video>


    <div class="video-overlay"></div>


    <div class="video-content">

        <div class="bismillah">
            بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
        </div>

        <div class="video-names">
            Shahul & Safa
        </div>

        <div class="video-date">
            22 November 2026
        </div>

    </div>


    <div class="scroll-indicator">

        Scroll to discover

        <div class="scroll-line"></div>

    </div>

</section>



<!-- =====================================================
     SECTION 2
     STATIC GRAPHIC
===================================================== -->

<section class="graphic-section">

    <div class="graphic-background"></div>


    <div class="graphic-wrapper">

        <img
            src="images/graphic.jpg"
            class="graphic-image"
            alt="Shahul and Safa Wedding Graphic">

        <div class="graphic-overlay"></div>

    </div>

</section>



<!-- =====================================================
     SECTION 3
     INVITATION ENVELOPE
===================================================== -->

<section
    class="invitation-section"
    id="invitation">


    <div class="envelope-container">

        <div class="envelope">


            <!-- Invitation paper -->

            <div class="invitation-paper">

                <div class="paper-content">

                    <div class="paper-small">
                        Together with their families
                    </div>

                    <div class="paper-names">
                        Shahul & Safa
                    </div>

                    <div class="paper-date">
                        22 · 11 · 2026
                    </div>

                </div>

            </div>


            <!-- Envelope flaps -->

            <div class="flap-left"></div>

            <div class="flap-right"></div>

            <div class="flap-bottom"></div>

            <div class="flap-top"></div>


            <!-- Wax seal -->

            <div class="wax-seal">

                <div class="seal-flower">
                    ✿
                </div>

                <div class="seal-symbol">
                    S & S
                </div>

            </div>

        </div>


        <!-- Open invitation -->

        <button
            class="open-invitation"
            id="openInvitation">

            Open The Invitation

        </button>

    </div>

</section>



<script>


/* =====================================================
   OPEN INVITATION
===================================================== */

const invitationSection =
    document.getElementById("invitation");

const openInvitation =
    document.getElementById("openInvitation");


openInvitation.addEventListener("click", function () {

    invitationSection.classList.add("open");

});


/* =====================================================
   AUTO PLAY VIDEO
===================================================== */

const video =
    document.querySelector(".wedding-video");


/*
Browsers normally allow autoplay only
when the video is muted.

This keeps it muted initially.
*/


video.play().catch(function () {

    console.log("Video autoplay requires user interaction.");

});


/* =====================================================
   OPTIONAL:
   CLICK ENVELOPE ALSO OPENS IT
===================================================== */

const envelope =
    document.querySelector(".envelope");


envelope.addEventListener("click", function () {

    invitationSection.classList.add("open");

});


</script>


</body>
</html>
